[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop", "apps/overlay"]
# The Tauri shell and the egui overlay need windowing system libraries, so plain
# `cargo test` runs only the platform-independent crates. CI builds `apps/*` on Windows.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
# internal
domain = { path = "crates/domain" }
lcu-client = { path = "crates/lcu-client" }
overlay = { path = "apps/overlay" }
opgg = { path = "crates/opgg" }
static-data = { path = "crates/static-data" }
app-core = { path = "crates/app-core" }
ipc-types = { path = "crates/ipc-types" }
mock-league = { path = "crates/mock-league" }

# external
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
ts-rs = { version = "12", features = ["serde-compat"] }

# dev and the mock-league test harness
proptest = "1"
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
