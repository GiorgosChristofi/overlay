# cargo-deny: licences, security advisories, duplicate and unknown sources.
[graph]
all-features = false
# The only target we ship. cargo-deny filters each dependency edge against
# all listed targets, not the whole path, so listing Linux too dragged in
# Linux-only deps of Windows-only crates (active-win-pos-rs -> hyprland, GPL)
# and Tauri's GTK stack (proc-macro-error, unmaintained). Linux CI only runs
# the tests of the core crates; we never build or ship for it.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0",
]
# egui's built-in fonts (in-game item column).
exceptions = [
  { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates are path dependencies without a version; every one is
# `publish = false`, which this setting requires.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
